<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Sénégal - Direct &amp; Replay</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00853f">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo">
      <div class="flag-stripes">
        <div class="flag-stripe green"></div>
        <div class="flag-stripe yellow"></div>
        <div class="flag-stripe red"></div>
      </div>
      <h1 class="splash-title">TV <span>Sénégal</span></h1>
    </div>
    <div class="loader-spinner"></div>
  </div>

  <div id="app-container">
    <div id="player-wrapper">
      <video id="main-video" playsinline webkit-playsinline></video>
      <iframe id="youtube-iframe" style="display:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="ui-layer">
      <header class="top-bar">
        <div class="brand-wrapper">
          <button id="btn-toggle-menu" class="btn-nav dpad-nav" tabindex="0">&#9776; <span data-i18n="channels">Chaînes</span></button>
          <div class="brand-logo-txt">TV <span>Sénégal</span></div>
        </div>
        <div class="current-channel-info">
          <h2 id="current-channel-name">Chargement...</h2>
          <span id="stream-status-badge" class="status-badge status-live" data-i18n="live">EN DIRECT</span>
        </div>
        <div class="header-buttons">
          <button id="btn-replay" class="btn-nav dpad-nav" tabindex="0" data-i18n="replay_btn">YouTube Replay</button>
          <button id="btn-settings" class="btn-nav dpad-nav" tabindex="0" data-i18n="settings">Paramètres</button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar-panel">
        <div class="sidebar-header"><h2 data-i18n="channels">Chaînes du Sénégal</h2></div>
        <nav id="channel-list" class="channels-scroll-area"></nav>
      </aside>
    </div>
  </div>

  <div id="instructions-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <h2 class="modal-title" data-i18n="instructions_title">Bienvenue sur TV Sénégal</h2>
      <ul class="instructions-list">
        <li><span class="key-icon">D-PAD</span><span data-i18n="instruction_dpad">Naviguer avec les flèches</span></li>
        <li><span class="key-icon">OK</span><span data-i18n="instruction_ok">Sélectionner la chaîne</span></li>
        <li><span class="key-icon">RETOUR</span><span data-i18n="instruction_back">Masquer/Afficher le menu</span></li>
      </ul>
      <button id="btn-close-instructions" class="modal-btn dpad-nav" tabindex="0" data-i18n="btn_understood">J'ai compris, regarder la TV</button>
    </div>
  </div>

  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <h2 class="modal-title" data-i18n="settings">Paramètres</h2>
      <div class="settings-group">
        <h3 data-i18n="settings_privacy_title">Confidentialité</h3>
        <p data-i18n="settings_privacy_desc" style="font-size: 0.85rem; color: #a9b7b0; margin: 8px 0;"></p>
        <div class="toggle-container">
          <span id="storage-status-text">Stockage activé</span>
          <div id="storage-toggle" class="toggle-switch active dpad-nav" tabindex="0"><div class="toggle-knob"></div></div>
        </div>
      </div>
      <div class="settings-group">
        <label data-i18n="language_label" style="font-weight:600;">Langue :</label>
        <div class="lang-selector-group">
          <button class="lang-btn dpad-nav" data-lang="fr" tabindex="0">Français</button>
          <button class="lang-btn dpad-nav" data-lang="wo" tabindex="0">Wolof</button>
          <button class="lang-btn dpad-nav" data-lang="en" tabindex="0">English</button>
          <button class="lang-btn dpad-nav" data-lang="it" tabindex="0">Italiano</button>
        </div>
      </div>
      <button id="btn-close-settings" class="modal-btn dpad-nav" tabindex="0" data-i18n="close_btn">Fermer</button>
    </div>
  </div>

  <div id="toast-msg"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/remote.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js'); });
    }
  </script>
</body>
</html>
