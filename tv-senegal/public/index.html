<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Sénégal - Direct &amp; Replay</title>
  <meta name="description" content="Regardez les chaînes de télévision sénégalaises en direct et en replay.">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <meta name="theme-color" content="#00853f">

  <link rel="stylesheet" href="/css/style.css">
  <!-- hls.js da CDN, compatibile anche con browser legacy -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>

  <!-- Schermata di caricamento con tema bandiera Senegal -->
  <div id="splash-screen">
    <div class="splash-logo">
      <div class="flag-stripes">
        <div class="flag-stripe green"></div>
        <div class="flag-stripe yellow"></div>
        <div class="flag-stripe red"></div>
      </div>
      <h1 class="splash-title">TV <span>Sénégal</span></h1>
    </div>
    <div class="loader-spinner"></div>
  </div>

  <div id="app-container">
    <!-- Area video: HLS (nativo / hls.js) + iframe YouTube -->
    <div id="player-wrapper">
      <video id="main-video" controls playsinline webkit-playsinline></video>
      <iframe id="youtube-iframe" style="display:none;" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <!-- Overlay UI -->
    <div class="ui-layer">

      <!-- Barra laterale canali -->
      <aside id="sidebar" class="sidebar-panel">
        <div class="sidebar-header">
          <h2 data-i18n="channels">Chaînes</h2>
        </div>
        <div id="channel-list" class="channels-scroll-area"></div>
      </aside>

      <!-- Barra superiore -->
      <header class="top-bar">
        <div class="brand-wrapper">
          <button id="btn-toggle-menu" class="btn-nav dpad-nav" tabindex="0">&#9776; <span data-i18n="channels">Chaînes</span></button>
          <div class="brand-logo-txt">TV <span>Sénégal</span></div>
        </div>

        <div class="current-channel-info">
          <h2 id="current-channel-name">...</h2>
          <span id="stream-status-badge" class="status-badge status-live" style="display:none;"></span>
        </div>

        <div class="header-buttons">
          <button id="btn-replay" class="btn-nav dpad-nav" tabindex="0" data-i18n="replay_btn">Replays YouTube</button>
          <button id="btn-settings" class="btn-nav dpad-nav" tabindex="0" data-i18n="settings">Paramètres</button>
        </div>
      </header>
    </div>
  </div>

  <!-- Modale istruzioni (prima visita) -->
  <div id="instructions-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <h2 class="modal-title" data-i18n="instructions_title">Bienvenue sur TV Sénégal</h2>
      <ul class="instructions-list">
        <li><span class="key-icon">&#9664; &#9650; &#9660; &#9654;</span><span data-i18n="instruction_dpad">D-Pad</span></li>
        <li><span class="key-icon">OK</span><span data-i18n="instruction_ok">OK</span></li>
        <li><span class="key-icon">&#8617;</span><span data-i18n="instruction_back">Retour</span></li>
      </ul>
      <button id="btn-close-instructions" class="modal-btn dpad-nav" tabindex="0" data-i18n="btn_understood">J'ai compris</button>
    </div>
  </div>

  <!-- Modale impostazioni -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <h2 class="modal-title" data-i18n="settings">Paramètres</h2>

      <div class="settings-group">
        <h3 data-i18n="settings_privacy_title">Confidentialité</h3>
        <p data-i18n="settings_privacy_desc">Stockage local</p>
        <div class="toggle-container">
          <span id="storage-status-text"></span>
          <button id="storage-toggle" class="toggle-switch dpad-nav active" tabindex="0" role="switch" aria-checked="true">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </div>

      <div class="settings-group">
        <h3 data-i18n="language_label">Langue :</h3>
        <div class="lang-selector-group">
          <button class="lang-btn dpad-nav" tabindex="0" data-lang="fr">Français</button>
          <button class="lang-btn dpad-nav" tabindex="0" data-lang="wo">Wolof</button>
          <button class="lang-btn dpad-nav" tabindex="0" data-lang="en">English</button>
          <button class="lang-btn dpad-nav" tabindex="0" data-lang="it">Italiano</button>
        </div>
      </div>

      <button id="btn-close-settings" class="modal-btn dpad-nav" tabindex="0" data-i18n="close_btn">Fermer</button>
    </div>
  </div>

  <div id="toast-msg"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/remote.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
