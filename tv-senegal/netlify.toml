[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https: wss:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: https: data:; img-src 'self' data: https:; connect-src 'self' https:;"

[[redirects]]
  from = "/api/stream/*"
  to = "/.netlify/functions/stream-resolver?id=:splat"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh-streams"
  status = 200

[functions."refresh-streams"]
  schedule = "*/30 * * * *"
