[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https: wss:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: https: data:; img-src 'self' data: https:; connect-src 'self' https:;"

# Il service worker non deve restare in cache del browser
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Nota: la funzione stream-resolver espone da sola /api/stream/:id (config.path)
# e scheduled-refresh definisce da sola il cron (config.schedule): nessun redirect necessario.
